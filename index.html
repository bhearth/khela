<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no">
    <title>Khel.o · Dis-play Humanity OS</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,600,1,0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>

    <style>
        :root { 
            --bg: #010204; 
            --accent: #38bdf8; 
            --gold: #fbbf24; 
            --emerald: #10b981;
            --rose: #f43f5e;
            --purple: #a78bfa;
            --surface: rgba(10, 15, 25, 0.6); 
            --border: rgba(255, 255, 255, 0.1); 
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; 
            overflow: hidden; touch-action: none; overscroll-behavior: none;
            background-image: radial-gradient(circle at center, #0a1128 0%, #010204 100%);
        }

        /* --- 3D CANVAS LAYER --- */
        #canvas-container { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
        #svg-layer { position: absolute; top: -5000px; left: -5000px; width: 10000px; height: 10000px; pointer-events: none; z-index: 2; }
        .stellar-path { fill: none; stroke-width: 1.5; stroke-linecap: round; filter: drop-shadow(0 0 6px currentColor); transition: d 1s cubic-bezier(0.34, 1.56, 0.64, 1); }

        #dom-matrix { position: absolute; top: 50vh; left: 50vw; transform-style: preserve-3d; will-change: transform; z-index: 5; }

        /* --- 3D NODES --- */
        .os-node {
            position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
            transform: translate(-50%, -50%); pointer-events: auto; cursor: pointer;
            border-radius: 50%; background: rgba(10, 15, 25, 0.85); border: 2px solid currentColor;
            backdrop-filter: blur(10px); outline: none;
            transition: transform 1s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }
        .os-node:hover, .os-node:focus-visible { background: currentColor !important; color: #000 !important; box-shadow: 0 0 40px currentColor; z-index: 100; transform: translate(-50%, -50%) scale(1.25) !important; }
        .node-icon { font-size: clamp(24px, 5vw, 36px); filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); transition: 0.3s; }
        .os-node:hover .node-icon { transform: scale(1.1); }
        .node-label { font-family: 'Space Grotesk'; font-size: 10px; font-weight: bold; margin-top: 6px; text-transform: uppercase; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 4px #000; pointer-events: none; white-space: nowrap;}
        .os-node:hover .node-label { color: #000; text-shadow: none; }

        /* --- UI OVERLAYS --- */
        .ui-layer { position: absolute; inset: 0; z-index: 100; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; }
        .interactive { pointer-events: auto; }

        /* --- TOP SEARCH & VOICE --- */
        .top-bar { padding: 20px; display: flex; justify-content: center; width: 100%; transition: 0.5s; z-index: 110; }
        .search-box {
            width: 100%; max-width: 600px; display: flex; align-items: center;
            background: var(--surface); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 40px;
            padding: 12px 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); transition: 0.3s;
        }
        .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); background: rgba(15, 23, 42, 0.95); transform: translateY(-2px); }
        .search-input { flex: 1; background: transparent; border: none; color: #fff; font-family: 'Inter'; font-size: 1.1rem; outline: none; margin: 0 12px; }
        
        .voice-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: #fff; cursor: pointer; transition: 0.3s; flex-shrink: 0; }
        .voice-btn:hover { background: rgba(255,255,255,0.15); color: var(--accent); }
        .voice-btn.recording { background: rgba(244, 63, 94, 0.2); color: var(--rose); border-color: var(--rose); animation: pulseRecord 1.5s infinite; }
        @keyframes pulseRecord { 0% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.4); } 70% { box-shadow: 0 0 0 15px rgba(244, 63, 94, 0); } 100% { box-shadow: 0 0 0 0 rgba(244, 63, 94, 0); } }

        /* --- DYNAMIC SYMBOL RIBBON (The Evolution) --- */
        .symbol-ribbon-wrapper {
            position: absolute; bottom: 90px; left: 0; right: 0;
            padding: 20px 0; overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }
        .ribbon-title { font-family: 'Space Grotesk'; font-size: 10px; color: var(--emerald); text-transform: uppercase; letter-spacing: 3px; font-weight: bold; margin-bottom: 12px; text-shadow: 0 2px 4px #000; }
        
        .symbol-ribbon {
            display: flex; gap: 16px; overflow-x: auto; padding: 10px 40px;
            width: 100%; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth;
            align-items: center; justify-content: center;
        }
        .symbol-ribbon::-webkit-scrollbar { display: none; }
        
        .ribbon-node {
            flex-shrink: 0; width: 64px; height: 64px; border-radius: 50%;
            background: rgba(10, 15, 25, 0.8); border: 2px solid;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; backdrop-filter: blur(10px); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.5); opacity: 0; transform: translateY(20px) scale(0.8);
        }
        .ribbon-node.visible { opacity: 1; transform: translateY(0) scale(1); }
        .ribbon-node:hover { transform: translateY(-10px) scale(1.2); z-index: 10; box-shadow: 0 15px 30px currentColor; background: currentColor; color: #000 !important; }
        .ribbon-node .r-icon { font-size: 26px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
        .ribbon-node .r-label { position: absolute; bottom: -24px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #fff; text-shadow: 0 2px 4px #000; white-space: nowrap; opacity: 0; transition: 0.3s; }
        .ribbon-node:hover .r-label { opacity: 1; bottom: -28px; }

        /* --- THE JOURNEY BAR (Bottom) --- */
        .journey-wrapper {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(3, 5, 8, 0.95); backdrop-filter: blur(20px); border-top: 1px solid var(--border);
            padding: 16px 24px; display: flex; align-items: center; justify-content: center; z-index: 200;
        }
        .flow-track {
            display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; max-width: 1000px; width: 100%;
        }
        .flow-track::-webkit-scrollbar { display: none; }
        .flow-step {
            font-family: 'Space Grotesk'; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            color: #64748b; padding: 8px 16px; border-radius: 20px; transition: 0.3s; cursor: pointer; white-space: nowrap;
            border: 1px solid transparent; background: transparent;
        }
        .flow-step:hover { color: #e2e8f0; background: rgba(255,255,255,0.05); }
        .flow-step.active { color: var(--emerald); background: rgba(16, 185, 129, 0.1); border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .flow-arrow { color: #334155; font-size: 14px; font-weight: bold; }

        /* --- 6D COSMIC DRILL-DOWN PANEL --- */
        .cosmic-panel {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(10, 15, 25, 0.98); backdrop-filter: blur(30px);
            border: 1px solid var(--border); border-radius: 32px; padding: 40px;
            max-width: 800px; width: 92%; max-height: 85vh; overflow-y: auto;
            z-index: 300; display: none; opacity: 0; box-shadow: 0 30px 80px rgba(0,0,0,0.9);
        }
        .cosmic-panel.active { display: block; animation: panelIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        @keyframes panelIn { from { opacity: 0; transform: translate(-50%, -45%) scale(0.95); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        
        .cp-header { text-align: center; margin-bottom: 2rem; position: relative; }
        .cp-icon { font-size: 5rem; filter: drop-shadow(0 0 30px rgba(56,189,248,0.5)); margin-bottom: 10px; }
        .cp-title { font-family: 'Space Grotesk'; font-size: 2.5rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 2px; }
        .cp-subtitle { font-size: 0.9rem; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; font-weight: 600; margin-top: 5px; }
        
        .res-badges { display: flex; justify-content: center; gap: 12px; margin-top: 15px; }
        .badge { padding: 6px 16px; border-radius: 30px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 6px; }
        .badge.phase { background: rgba(245, 158, 11, 0.1); color: var(--gold); border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge.disc { background: rgba(167, 139, 250, 0.1); color: var(--purple); border: 1px solid rgba(167, 139, 250, 0.3); }

        .discipline-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-top: 2rem; }
        .discipline-card { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 16px; padding: 20px; transition: 0.3s; border-left: 3px solid var(--c); }
        .discipline-card:hover { transform: translateY(-4px); background: rgba(255,255,255,0.05); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .d-header { display: flex; align-items: center; gap: 8px; font-family: 'Space Grotesk'; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--c); margin-bottom: 12px; }
        .d-concept { font-size: 14px; color: #e2e8f0; line-height: 1.6; }

        .close-btn { position: absolute; top: 24px; right: 24px; width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.3s; }
        .close-btn:hover { background: rgba(244,63,94,0.2); color: var(--rose); border-color: var(--rose); transform: rotate(90deg); }

        /* --- TOAST --- */
        #toast-container { position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .toast { background: rgba(16, 185, 129, 0.95); color: #fff; padding: 12px 24px; border-radius: 30px; font-weight: bold; font-family: 'Space Grotesk'; font-size: 13px; letter-spacing: 1px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: slideDown 0.3s ease forwards; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(10px);}
        @keyframes slideDown { from { transform: translateY(-20px) scale(0.9); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

        /* --- LOADER --- */
        #ai-loader { position: fixed; inset: 0; background: rgba(1, 2, 4, 0.85); z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .spinner { width: 60px; height: 60px; border: 4px solid rgba(56, 189, 248, 0.1); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { margin-top: 24px; font-family: 'Space Grotesk'; color: var(--accent); letter-spacing: 4px; text-transform: uppercase; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<!-- 1. THE 3D VOID -->
<div id="canvas-container"></div>
<div id="dom-matrix"><svg id="svg-layer"></svg></div>

<!-- 2. THE UI OVERLAY -->
<div class="ui-layer">
    
    <!-- Top Search & Voice -->
    <div class="top-bar interactive">
        <div class="search-box">
            <span class="material-symbols-rounded text-sky-400">auto_awesome</span>
            <input type="text" id="omni-input" class="search-input" placeholder="What shall we explore today?" autocomplete="off">
            <button class="voice-btn" id="voice-btn" onclick="SystemCore.toggleVoice()" title="Voice Search">
                <span class="material-symbols-rounded">mic</span>
            </button>
            <span class="material-symbols-rounded text-slate-400 hover:text-sky-400 cursor-pointer ml-3 transition-colors" onclick="SemanticEngine.processQuery()" title="Synthesize">search</span>
        </div>
    </div>

    <!-- The Dynamic Symbol Ribbon (The Evolution) -->
    <div class="symbol-ribbon-wrapper interactive">
        <div class="ribbon-title" id="ribbon-title">Contextual Awareness</div>
        <div class="symbol-ribbon" id="symbol-ribbon">
            <!-- Dynamic nodes injected here -->
        </div>
    </div>
</div>

<!-- 3. THE JOURNEY BAR (Bottom) -->
<div class="journey-wrapper interactive">
    <div class="flow-track" id="journey-track">
        <!-- Stages injected via JS -->
    </div>
</div>

<!-- 4. THE 6D COSMIC DRILL-DOWN PANEL -->
<div class="cosmic-panel interactive" id="cosmic-panel">
    <button class="close-btn" onclick="UIController.closeCosmicPanel()">✕</button>
    <div class="cp-header">
        <div id="cp-icon" class="cp-icon">✨</div>
        <div id="cp-title" class="cp-title">Concept</div>
        <div class="cp-subtitle">6D Ontological Drill-Down</div>
        <div class="res-badges">
            <div class="badge phase"><span class="material-symbols-rounded" id="cp-phase-icon">child_care</span> <span id="cp-phase">Phase</span></div>
            <div class="badge disc"><span class="material-symbols-rounded" id="cp-disc-icon">psychology</span> <span id="cp-disc">Discipline</span></div>
        </div>
        <p id="cp-summary" class="mt-6 text-slate-300 text-sm leading-relaxed max-w-2xl mx-auto"></p>
    </div>
    <div class="discipline-grid" id="cp-grid">
        <!-- 6D cards injected here -->
    </div>
</div>

<!-- Loader -->
<div id="ai-loader">
    <div class="spinner"></div>
    <div class="loading-text" id="loader-msg">Mapping Universe...</div>
</div>

<!-- Toasts -->
<div id="toast-container"></div>

<script>
/**
 * */
const SystemCore = {
    recognition: null,
    isRecording: false,

    init() {
        // Setup Voice Recognition if available
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            this.recognition = new SpeechRecognition();
            this.recognition.continuous = false;
            this.recognition.interimResults = false;
            this.recognition.lang = 'en-US';

            this.recognition.onstart = () => {
                this.isRecording = true;
                document.getElementById('voice-btn').classList.add('recording');
                this.showToast("Listening...", "mic");
                this.vibrate([20, 50, 20]);
            };

            this.recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('omni-input').value = transcript;
                SemanticEngine.processQuery(transcript);
            };

            this.recognition.onerror = (e) => {
                this.showToast("Voice error: " + e.error, "error");
                this.stopVoice();
            };

            this.recognition.onend = () => this.stopVoice();
        }
    },

    toggleVoice() {
        if (!this.recognition) return this.showToast("Voice not supported", "error");
        if (this.isRecording) {
            this.recognition.stop();
        } else {
            this.recognition.start();
        }
    },

    stopVoice() {
        this.isRecording = false;
        document.getElementById('voice-btn').classList.remove('recording');
    },

    vibrate(pattern = 15) {
        if (navigator.vibrate) navigator.vibrate(pattern);
    },

    showToast(msg, icon = "eco") {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.innerHTML = `<span class="material-symbols-rounded text-emerald-400">${icon}</span> ${msg}`;
        container.appendChild(toast);
        setTimeout(() => {
            toast.style.animation = 'slideDown 0.3s ease reverse forwards';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }
};

/**
 * */
const SymbolDB = {
    // Maps Journey stages to core semantic concepts for the Ribbon
    journeyMap: {
        'Discover': [
            { id: 'd1', label: 'Space', icon: '🔭', color: '#818cf8', query: 'astronomy cosmos' },
            { id: 'd2', label: 'Nature', icon: '🌍', color: '#10b981', query: 'nature earth environment' },
            { id: 'd3', label: 'Questions', icon: '❓', color: '#fbbf24', query: 'philosophy inquiry' },
            { id: 'd4', label: 'Micro', icon: '🔬', color: '#38bdf8', query: 'biology cells' }
        ],
        'Meet': [
            { id: 'm1', label: 'Community', icon: '🤝', color: '#f472b6', query: 'society community' },
            { id: 'm2', label: 'Cultures', icon: '🌍', color: '#34d399', query: 'culture anthropology' },
            { id: 'm3', label: 'Languages', icon: '🗣️', color: '#c084fc', query: 'language linguistics' },
            { id: 'm4', label: 'History', icon: '📜', color: '#f59e0b', query: 'history civilization' }
        ],
        'Learn': [
            { id: 'l1', label: 'Math', icon: '📐', color: '#38bdf8', query: 'mathematics geometry' },
            { id: 'l2', label: 'Physics', icon: '⚛️', color: '#fbbf24', query: 'physics energy' },
            { id: 'l3', label: 'Biology', icon: '🧬', color: '#10b981', query: 'biology genetics' },
            { id: 'l4', label: 'Code', icon: '💻', color: '#a78bfa', query: 'computer science code' }
        ],
        'Experience': [
            { id: 'e1', label: 'Play', icon: '🏃', color: '#f43f5e', query: 'sports play movement' },
            { id: 'e2', label: 'Music', icon: '🎵', color: '#c084fc', query: 'music sound audio' },
            { id: 'e3', label: 'Art', icon: '🎨', color: '#fbbf24', query: 'art painting visual' },
            { id: 'e4', label: 'Food', icon: '🍎', color: '#10b981', query: 'food nutrition cooking' }
        ],
        'Contribute': [
            { id: 'c1', label: 'Volunteer', icon: '🤲', color: '#f472b6', query: 'volunteering help' },
            { id: 'c2', label: 'Plant', icon: '🌱', color: '#10b981', query: 'planting ecology' },
            { id: 'c3', label: 'Teach', icon: '👨‍🏫', color: '#38bdf8', query: 'teaching education' },
            { id: 'c4', label: 'Build', icon: '🛠️', color: '#fbbf24', query: 'engineering building' }
        ],
        'Evolve': [
            { id: 'ev1', label: 'Transform', icon: '🦋', color: '#c084fc', query: 'transformation evolution' },
            { id: 'ev2', label: 'Singularity', icon: '🌀', color: '#38bdf8', query: 'singularity future' },
            { id: 'ev3', label: 'Cosmos', icon: '🚀', color: '#f59e0b', query: 'space exploration' },
            { id: 'ev4', label: 'Infinite', icon: '♾️', color: '#f43f5e', query: 'infinity endless' }
        ]
    },

    // A fallback 6D generator for offline/fast mode
    generateFallback6D(query) {
        const icons = ['🌟','🚀','🎨','🦁','🍎','🌈','🧩','🦋','🧸','💎','🔮','🌊','🔥','⚡'];
        const colors = ['#38bdf8', '#10b981', '#fbbf24', '#f43f5e', '#a78bfa', '#34d399'];
        
        return {
            topic: query.toUpperCase(),
            summary: `Exploring the multi-dimensional facets of ${query}.`,
            phase: 'Youth',
            discipline: 'Philosophy',
            nodes: Array.from({length: 6}).map((_, i) => ({
                id: `n_${i}`,
                label: `Aspect ${i+1}`,
                icon: icons[Math.floor(Math.random()*icons.length)],
                color: colors[i % colors.length]
            })),
            cosmic_matrix: {
                physics: `The kinetic and energetic state of ${query}.`,
                biology: `The organic and cellular impact of ${query}.`,
                psychology: `The cognitive resonance of ${query}.`,
                sociology: `Cultural evolution surrounding ${query}.`,
                economics: `Resource allocation and value of ${query}.`,
                philosophy: `The existential meaning of ${query}.`
            }
        };
    }
};

/**
 * */
const VisualEngine = {
    scene: null, camera: null, renderer: null, hub: null, svgLayer: null,
    nodes: [], edges: [], stars: null,
    cam: { x:0, y:0, z:0.6, rx:0, ry:0 },
    tgt: { x:0, y:0, z:0.6, rx:0, ry:0 },
    layout: 'galaxy', // default

    init() {
        this.scene = new THREE.Scene();
        this.camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        this.camera.position.z = 50;

        this.renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
        this.renderer.setSize(window.innerWidth, window.innerHeight);
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(this.renderer.domElement);

        this.hub = document.getElementById('dom-matrix');
        this.svgLayer = document.getElementById('svg-layer');

        // Starfield
        const geo = new THREE.BufferGeometry();
        const pts = [];
        for(let i=0; i<600; i++) pts.push((Math.random()-0.5)*300, (Math.random()-0.5)*300, (Math.random()-0.5)*300);
        geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
        this.stars = new THREE.Points(geo, new THREE.PointsMaterial({color: 0x38bdf8, size: 0.2, transparent: true, opacity: 0.3}));
        this.scene.add(this.stars);

        window.addEventListener('resize', () => {
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        });

        this.setupGestures();
        this.renderLoop();
    },

    clearGraph() {
        this.nodes.forEach(n => n.el.remove());
        this.nodes = []; this.edges = [];
        this.svgLayer.innerHTML = '';
        this.tgt = { x:0, y:0, z:0.6, rx:0, ry:0 }; // Reset cam
    },

    buildGraph(data, layoutType = 'galaxy') {
        this.clearGraph();
        this.layout = layoutType;

        // Root Node
        const root = { id: 'root', label: data.topic, icon: '☀️', color: '#ffffff' };
        this.spawnNode(root, 0, data);

        // Child Nodes
        (data.nodes || []).forEach((n, i) => {
            this.spawnNode(n, i + 1, data);
            this.addEdge(0, i + 1, n.color);
        });

        this.applyLayout();
    },

    spawnNode(d, index, fullData) {
        const el = document.createElement('div');
        el.className = 'os-node';
        const sz = index === 0 ? 100 : 70;
        
        el.style.cssText = `--x:0px; --y:0px; --z:0px; width:${sz}px; height:${sz}px; color:${d.color}; animation-delay: ${index*0.05}s;`;
        el.innerHTML = `<div class="node-icon">${d.icon}</div><div class="node-label" style="color:${d.color}">${d.label}</div>`;
        
        el.onclick = (e) => {
            e.stopPropagation();
            SystemCore.vibrate(20);
            
            // Focus Camera
            const n = this.nodes[index];
            this.tgt.x = -n.tx; this.tgt.y = -n.ty; this.tgt.z = index === 0 ? 0.8 : 1.2;

            // Open 6D Drilldown
            UIController.openCosmicPanel(d.icon, d.label, fullData);
        };

        this.hub.appendChild(el);
        this.nodes.push({ id: d.id, el, x:0, y:0, z:0, tx:0, ty:0, tz:0 });
    },

    addEdge(sIdx, tIdx, color) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("class", "stellar-path");
        path.style.stroke = color;
        path.style.strokeOpacity = 0.4;
        this.svgLayer.appendChild(path);
        this.edges.push({ s: sIdx, t: tIdx, el: path });
    },

    applyLayout() {
        const total = this.nodes.length - 1;
        if(total < 1) return;

        this.nodes.forEach((n, i) => {
            if(i === 0) { n.tx=0; n.ty=0; n.tz=0; return; }
            let idx = i - 1;

            if (this.layout === 'galaxy') {
                // Fibonacci Spiral
                const angle = idx * 137.508 * (Math.PI / 180);
                const r = 100 + Math.sqrt(idx) * 40;
                n.tx = Math.cos(angle) * r;
                n.ty = Math.sin(angle) * r;
                n.tz = Math.sin(idx * 0.5) * 40;
            } else if (this.layout === 'tree') {
                // Pyramid Hierarchical
                const row = Math.floor(Math.sqrt(idx));
                const col = idx - (row * row);
                const items = row * 2 + 1;
                n.tx = (col - Math.floor(items/2)) * 120;
                n.ty = (row + 1) * -120 + 150;
                n.tz = 0;
                if(i === 1) n.ty = 250; // push first child up
            } else if (this.layout === 'radial') {
                // Circle
                const angle = (idx / total) * Math.PI * 2;
                const r = 200;
                n.tx = Math.cos(angle) * r;
                n.ty = Math.sin(angle) * r;
                n.tz = (idx % 2 === 0) ? 30 : -30;
            }
        });
    },

    setupGestures() {
        const mc = new Hammer.Manager(document.getElementById('canvas-container'));
        mc.add(new Hammer.Pan({ threshold: 0 }));
        mc.add(new Hammer.Pinch({ enable: true })).recognizeWith(mc.get('pan'));
        mc.add(new Hammer.Tap({ event: 'doubletap', taps: 2 }));

        let initZ = 1, isPan = false, lx = 0, ly = 0;

        mc.on('doubletap', () => {
            SystemCore.vibrate(20);
            this.tgt.x = 0; this.tgt.y = 0; this.tgt.z = 0.6; this.tgt.rx = 0; this.tgt.ry = 0;
        });

        mc.on('pinchstart', () => initZ = this.tgt.z);
        mc.on('pinch', e => this.tgt.z = Math.max(0.1, Math.min(4, initZ * e.scale)));

        mc.on('panstart', e => { isPan = true; lx = e.center.x; ly = e.center.y; });
        mc.on('panmove', e => {
            if (!isPan) return;
            let dx = e.center.x - lx, dy = e.center.y - ly;
            if (e.pointers.length >= 2 || e.srcEvent.shiftKey) { 
                this.tgt.ry += dx * 0.4; this.tgt.rx -= dy * 0.4;
            } else { 
                this.tgt.x += dx / this.cam.z; this.tgt.y += dy / this.cam.z;
            }
            lx = e.center.x; ly = e.center.y;
        });
        mc.on('panend pancancel', () => isPan = false);
        window.addEventListener('wheel', e => { this.tgt.z = Math.max(0.1, Math.min(4, this.tgt.z - e.deltaY * 0.0015)); }, {passive:true});
    },

    lerp(a, b, t) { return a + (b - a) * t; },

    renderLoop() {
        // Camera Physics
        this.cam.x = this.lerp(this.cam.x, this.tgt.x, 0.08); 
        this.cam.y = this.lerp(this.cam.y, this.tgt.y, 0.08);
        this.cam.z = this.lerp(this.cam.z, this.tgt.z, 0.08);
        this.cam.rx = this.lerp(this.cam.rx, this.tgt.rx, 0.08); 
        this.cam.ry = this.lerp(this.cam.ry, this.tgt.ry, 0.08);

        this.hub.style.transform = `translate(-50%, -50%) perspective(1500px) scale(${this.cam.z}) translate3d(${this.cam.x}px, ${this.cam.y}px, 0) rotateX(${this.cam.rx}deg) rotateY(${this.cam.ry}deg)`;

        // Node Physics
        this.nodes.forEach(n => {
            n.x = this.lerp(n.x, n.tx, 0.06); n.y = this.lerp(n.y, n.ty, 0.06); n.z = this.lerp(n.z, n.tz, 0.06);
            n.el.style.setProperty('--x', `${n.x}px`); n.el.style.setProperty('--y', `${n.y}px`); n.el.style.setProperty('--z', `${n.z}px`);
        });

        // Edge Physics
        this.edges.forEach(e => {
            const sn = this.nodes[e.s]; const tn = this.nodes[e.t];
            if(sn && tn) {
                const mx = (sn.x + tn.x) / 2 - (tn.y - sn.y) * 0.15 + 5000; 
                const my = (sn.y + tn.y) / 2 + (tn.x - sn.x) * 0.15 + 5000;
                e.el.setAttribute("d", `M${sn.x + 5000} ${sn.y + 5000} Q${mx} ${my} ${tn.x + 5000} ${tn.y + 5000}`);
            }
        });

        // Idle Rotation
        if(Math.abs(this.tgt.ry - this.cam.ry) < 0.01 && this.nodes.length > 1) {
            this.tgt.ry += 0.002;
        }
        if(this.stars) { this.stars.rotation.y += 0.0005; }

        this.renderer.render(this.scene, this.camera);
        requestAnimationFrame(() => this.renderLoop());
    }
};

/**
 * */
const SemanticEngine = {
    apiKey: 'sk-2963449b94da43dba59be015fa1cd569', // DeepSeek key provided
    
    async processQuery(query) {
        if(!query) query = document.getElementById('omni-input').value.trim();
        if(!query) return;

        SystemCore.vibrate(20);
        document.getElementById('omni-input').value = ''; // clear
        document.getElementById('omni-input').placeholder = `Synthesizing "${query}"...`;
        
        UIController.showLoader(`Mapping ${query}...`);

        try {
            // Using DeepSeek API to generate 6D Ontology
            const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${this.apiKey}` },
                body: JSON.stringify({
                    model: 'deepseek-chat',
                    messages: [
                        { role: 'system', content: `You are an Ontological Engine for Khel.o OS. Map the query into a 6D matrix. Return strict JSON:
{
  "topic": "string",
  "summary": "1 engaging sentence for a kid/elder.",
  "phase": "Childhood" | "Youth" | "Adulthood" | "Elderhood",
  "discipline": "Physics" | "Biology" | "Psychology" | "Sociology" | "Economics" | "Philosophy",
  "nodes": [{"id":"n1", "label":"string", "icon":"single emoji", "color":"hex color"}],
  "cosmic_matrix": {
    "physics": "1 short sentence", "biology": "1 short sentence", 
    "psychology": "1 short sentence", "sociology": "1 short sentence",
    "economics": "1 short sentence", "philosophy": "1 short sentence"
  }
}` },
                        { role: 'user', content: query }
                    ],
                    response_format: { type: 'json_object' }
                })
            });

            if (!res.ok) throw new Error("API Limit or Network Error");
            
            const data = await res.json();
            const parsedData = JSON.parse(data.choices[0].message.content);
            
            UIController.hideLoader();
            VisualEngine.buildGraph(parsedData, 'galaxy');
            document.getElementById('omni-input').placeholder = "What shall we explore today?";
            
            SystemCore.showToast(`Synthesized: ${query}`);

        } catch (e) {
            console.warn("API Failed, using Smart Fallback...", e);
            // Fallback Generator
            const fallbackData = SymbolDB.generateFallback6D(query);
            UIController.hideLoader();
            VisualEngine.buildGraph(fallbackData, 'galaxy');
            document.getElementById('omni-input').placeholder = "What shall we explore today?";
            SystemCore.showToast(`Local Mapping: ${query}`);
        }
    }
};

/**
 * */
const UIController = {
    stages: ['Discover', 'Meet', 'Learn', 'Experience', 'Participate', 'Contribute', 'Create', 'Evolve'],
    
    init() {
        this.renderJourneyBar();
        this.setStage(0); // Default to Discover
        
        // Setup Enter key for search
        document.getElementById('omni-input').addEventListener('keypress', (e) => {
            if(e.key === 'Enter') SemanticEngine.processQuery();
        });
    },

    renderJourneyBar() {
        const track = document.getElementById('journey-track');
        let html = '';
        this.stages.forEach((stage, i) => {
            html += `<button class="flow-step" id="stage-${i}" onclick="UIController.setStage(${i})">${stage}</button>`;
            if (i < this.stages.length - 1) html += `<span class="flow-arrow">→</span>`;
        });
        track.innerHTML = html;
    },

    setStage(index) {
        SystemCore.vibrate(10);
        document.querySelectorAll('.flow-step').forEach(el => el.classList.remove('active'));
        document.getElementById(`stage-${index}`).classList.add('active');
        
        const stageName = this.stages[index];
        document.getElementById('ribbon-title').innerText = `${stageName} Sequence`;

        // Update Dynamic Ribbon
        const symbols = SymbolDB.journeyMap[stageName] || SymbolDB.journeyMap['Experience'];
        this.renderRibbon(symbols, stageName);
        
        // Alter 3D Layout based on stage to show visual morphing
        if(index < 3) VisualEngine.layout = 'galaxy';
        else if (index < 6) VisualEngine.layout = 'tree';
        else VisualEngine.layout = 'radial';
        
        if(VisualEngine.nodes.length > 0) VisualEngine.applyLayout();
    },

    renderRibbon(symbols, contextName) {
        const ribbon = document.getElementById('symbol-ribbon');
        ribbon.innerHTML = '';
        
        symbols.forEach((sym, i) => {
            const el = document.createElement('div');
            el.className = 'ribbon-node';
            el.style.color = sym.color;
            el.style.borderColor = sym.color;
            el.innerHTML = `<div class="r-icon">${sym.icon}</div><div class="r-label" style="background:${sym.color}; padding:2px 8px; border-radius:10px;">${sym.label}</div>`;
            
            el.onclick = () => {
                SystemCore.vibrate(15);
                SemanticEngine.processQuery(sym.query || sym.label);
            };

            ribbon.appendChild(el);
            
            // Staggered pop-in animation
            setTimeout(() => el.classList.add('visible'), i * 100 + 50);
        });
    },

    openCosmicPanel(icon, title, data) {
        const colors = { physics:'#38bdf8', biology:'#10b981', psychology:'#a78bfa', sociology:'#fbbf24', economics:'#ef4444', philosophy:'#ffffff' };
        const emojis = { physics:'⚛️', biology:'🧬', psychology:'🧠', sociology:'🤝', economics:'⚖️', philosophy:'👁️' };
        
        document.getElementById('cp-icon').innerText = icon;
        document.getElementById('cp-title').innerText = title;
        
        // Add Phase & Discipline badges if provided in data
        if(data.phase) {
            document.getElementById('cp-phase').innerText = data.phase;
            document.getElementById('cp-phase-icon').innerText = data.phase === 'Childhood' ? 'child_care' : data.phase === 'Elderhood' ? 'elderly' : 'psychology';
            document.querySelector('.badge.phase').style.display = 'flex';
        } else {
            document.querySelector('.badge.phase').style.display = 'none';
        }

        if(data.discipline) {
            document.getElementById('cp-disc').innerText = data.discipline;
            document.querySelector('.badge.disc').style.display = 'flex';
        } else {
            document.querySelector('.badge.disc').style.display = 'none';
        }

        let gridHtml = '';
        if (data.cosmic_matrix) {
            Object.entries(data.cosmic_matrix).forEach(([domain, text]) => {
                gridHtml += `
                    <div class="discipline-card" style="--c:${colors[domain]}">
                        <div class="d-header"><span class="text-lg">${emojis[domain]}</span> ${domain}</div>
                        <div class="d-concept">${text}</div>
                    </div>
                `;
            });
        } else {
            gridHtml = `<div class="text-slate-400 col-span-full text-center py-10">Matrix data unavailable.</div>`;
        }
        
        document.getElementById('cp-grid').innerHTML = gridHtml;
        document.getElementById('cosmic-panel').classList.add('active');
    },

    closeCosmicPanel() {
        document.getElementById('cosmic-panel').classList.remove('active');
    },

    showLoader(msg) {
        document.getElementById('loader-msg').innerText = msg;
        document.getElementById('ai-loader').style.display = 'flex';
    },

    hideLoader() {
        document.getElementById('ai-loader').style.display = 'none';
    }
};
