   KHEL.OS META-CONTRACT (SESSION SYNC & ERROR ARREST PROTOCOL)
   ══════════════════════════════════════════════════════════ */
const KhelOS = {
    registry: {},
    logs: [],
    register: function(sessionId, plugin) {
        try {
            if (!plugin.init || !plugin.destroy) throw new Error("Missing init/destroy methods");
            
            // Auto-namespace CSS
            if (plugin.css) {
                const style = document.createElement('style');
                style.id = `k${sessionId}-styles`;
                style.textContent = plugin.css; 
                document.head.appendChild(style);
            }
            
            // Isolate DOM
            const container = document.getElementById('khel-plugin-container');
            if (!container) throw new Error("Missing #khel-plugin-container");
            container.innerHTML = `<div id="k${sessionId}-root">${plugin.html || ''}</div>`;
            
            // Initialize safely
            plugin.init();
            this.registry[sessionId] = plugin;
            this.logs.push(`[OK] Session ${sessionId} loaded successfully.`);
            console.log(`%c[KhelOS] Session ${sessionId} Active`, 'color: #10b981; font-weight: bold;');
        } catch (e) {
            this.logs.push(`[CRITICAL] Session ${sessionId} failed: ${e.message}`);
            console.error(`[KhelOS] Session ${sessionId} crashed and was isolated.`, e);
            if(container) container.innerHTML = `<div style="color:red; padding:20px;">System Error: ${e.message}</div>`;
        }
    },
    unload: function(sessionId) {
        if (this.registry[sessionId]) {
            if(this.registry[sessionId].destroy) this.registry[sessionId].destroy();
            delete this.registry[sessionId];
            document.getElementById(`k${sessionId}-root`)?.remove();
            document.getElementById(`k${sessionId}-styles`)?.remove();
        }
    }
};

    // --- SPU ENGINE (Deterministic 3-Byte Hashing) ---
    spu: {
        // FNV-1a Hash Algorithm for deterministic 32-bit hashing
        hash: function(str) {
            let h = 0x811c9dc5;
            for (let i = 0; i < str.length; i++) {
                h ^= str.charCodeAt(i);
                h = Math.imul(h, 0x01000193);
            }
            return Math.abs(h >>> 0);
        },
        generate: function(text) {
            if (!text) return '0x00 0x00 0x00';
            const fullHash = this.hash(text.toLowerCase().trim());
            // Extract 3 Bytes (24 bits)
            const byte1 = (fullHash >> 16) & 0xFF; // Domain
            const byte2 = (fullHash >> 8) & 0xFF;  // Action
            const byte3 = fullHash & 0xFF;         // Scale
            
            return {
                hex: `0x${byte1.toString(16).padStart(2,'0').toUpperCase()} 0x${byte2.toString(16).padStart(2,'0').toUpperCase()} 0x${byte3.toString(16).padStart(2,'0').toUpperCase()}`,
                raw: [byte1, byte2, byte3],
                // Map Byte 1 to a Hue for visual representation
                hue: (byte1 / 255) * 360 
            };
        }
    },

    // --- AUDIO DSP ENGINE (432Hz Resonance) ---
    audio: {
        ctx: null,
        init: function() {
            if (!this.ctx) {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) { console.warn("Audio API not supported"); }
            }
            if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
        },
        play: function(hue) {
            this.init();
            if (!this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                // Map Hue (0-360) to a pleasant frequency range around 432Hz
                const freq = 200 + (hue * 0.65); 
                osc.frequency.setTargetAtTime(freq, this.ctx.currentTime, 0.05);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.8);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.8);
                if (navigator.vibrate) navigator.vibrate(15);
            } catch(e) { console.warn("Audio playback failed", e); }
        }

                if(input) {
                    input.value = r.name;

            };
            container.appendChild(el);
        });
    },

    bindEvents: function() {
        const input = document.getElementById('k1-spu-input');
        if(input) {
            input.addEventListener('input', (e) => this.processSPU(e.target.value));

            // Subtle color shift based on generated hue

            display.style.borderColor = `hsla(${result.hue}, 80%, 60%, 0.5)`;
            display.style.background = `hsla(${result.hue}, 80%, 60%, 0.1)`;
        }
    },

    destroy: function() {
        console.log("[Session 1] Core Kernel Unloaded.");
        if(this.audio.ctx) this.audio.ctx.close();

};

                return;
            }

            container.innerHTML = `<div class="k2-loader">NPU Compiling Semantics...</div>`;

            setTimeout(() => { // Simulate processing
                const results = Session2_KnowledgeMatrix.search(query);
                container.innerHTML = '';

                    const isSaved = Session2_KnowledgeMatrix.state.ledger.some(n => n.id === k.id);

                    el.onclick = () => Session2_KnowledgeMatrix.actions.handleCardClick(k);

        },

        updateLedgerStatus: function() {
            const statusEl = document.getElementById('k2-ledger-status');
            const countEl = document.getElementById('k2-ledger-count');
            if(statusEl && countEl) {

            }

    },

    // --- ACTIONS ---
    actions: {
        handleCardClick: function(concept) {
            // In a full app, this would open a detailed viewer. 
            // For Session 2, we compile it to the Karma Ledger.
            const added = Session2_KnowledgeMatrix.ledger.add(concept);
            
            // Trigger Audio DSP from Session 1 if available
            if (window.KhelOS && window.KhelOS.registry[1] && window.KhelOS.registry[1].audio) {
                window.KhelOS.registry[1].audio.play(concept.color === '#10b981' ? 140 : 200); // Fallback hue

            if (window.KhelOS && window.KhelOS.registry[1] && window.KhelOS.registry[1].ui) {
                window.KhelOS.registry[1].ui.showToast(added ? 'Concept Compiled to Karma Ledger!' : 'Already Compiled');
            }
            
            // Re-render to update checkmark
            const input = document.getElementById('k2-search-input');
            if(input) Session2_KnowledgeMatrix.ui.renderResults(input.value);
        }
    },

    // --- LIFECYCLE METHODS ---
    init: function() {
        try {
            this.state.ledger = this.ledger.load();
            this.ui.renderSearch();
            this.ui.updateLedgerStatus();
            console.log("[Session 2] Knowledge Matrix & Karma Ledger Initialized.");
        } catch(e) {
            throw new Error("Session 2 UI Initialization failed: " + e.message);
        }
    },

    destroy: function() {
        console.log("[Session 2] Knowledge Matrix Unloaded.");
        clearTimeout(this.state.searchTimeout);

/* ═══════════════════════════════════════════════════════════

            this.ui.render();
            console.log("[Session 3] Crafting Engine Initialized.");

            throw new Error("Session 3 UI Initialization failed: " + e.message);
        }

        .k4-info-close { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
                         border: none; background: rgba(255,255,255,0.1); color: #fff; cursor: pointer; font-size: 0.9rem; }
        
        .k4-empty-state { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
                          justify-content: center; color: var(--k1-muted, #94a3b8); text-align: center; padding: 40px; }
        .k4-empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.3; }
    `,

    // --- STATE ---
    state: {
        nodes: [],
        edges: [],
        selectedNode: null,
        animationFrame: null,
        viewport: { x: 0, y: 0, scale: 1 },
        layoutMode: 'chit' // 'sat' | 'chit' | 'anand'
    },

    // --- DATA LOADER (Reads from Session 2 Karma Ledger) ---
    loader: {
        load: () => {
            if (window.KhelOS && window.KhelOS.registry[2] && window.KhelOS.registry[2].state.ledger) {
                return window.KhelOS.registry[2].state.ledger;
            }
            return [];
        }
    },

    // --- LAYOUT ENGINES ---
    layout: {
        sat: (nodes, width, height) => {
            // Grid/Matrix Layout
            const cols = Math.ceil(Math.sqrt(nodes.length));
            const spacing = Math.min(120, (width - 100) / cols);
            nodes.forEach((n, i) => {
                n.x = 80 + (i % cols) * spacing;
                n.y = 80 + Math.floor(i / cols) * spacing;
            });
        },
        chit: (nodes, width, height) => {
            // Radial Orbit Layout
            const cx = width / 2;
            const cy = height / 2;
            const radius = Math.min(cx, cy) - 100;
            nodes.forEach((n, i) => {
                const angle = (i / nodes.length) * Math.PI * 2;
                n.x = cx + Math.cos(angle) * radius;
                n.y = cy + Math.sin(angle) * radius;
            });
        },
        anand: (nodes, width, height) => {
            // Fibonacci Spiral Layout
            const cx = width / 2;
            const cy = height / 2;
            nodes.forEach((n, i) => {
                const angle = i * 137.508 * (Math.PI / 180); // Golden angle
                const r = 70 + Math.sqrt(i + 1) * 45;
                n.x = cx + Math.cos(angle) * r;
                n.y = cy + Math.sin(angle) * r;
            });
        }
    },

    // --- RENDERER ---
    renderer: {
        render: () => {
            const container = document.getElementById('k4-graph-container');
            if (!container) return;

            const nodes = Session4_WonderGraph.loader.load();
            Session4_WonderGraph.state.nodes = nodes;

            if (nodes.length === 0) {
                container.innerHTML = `
                    <div class="k4-empty-state">
                        <div class="k4-empty-icon">🌌</div>
                        <div style="font-size: 1.2rem; font-weight: 700; margin-bottom: 8px;">Your Universe is Empty</div>
                        <div style="font-size: 0.9rem;">Compile concepts in the "Learn" section to see them appear here.</div>
                    </div>
                `;
                return;
            }

            const width = container.clientWidth;
            const height = container.clientHeight;
            const mode = Session4_WonderGraph.state.layoutMode;

            // Apply layout
            Session4_WonderGraph.layout[mode](nodes, width, height);

            // Generate edges (connect to center or based on tags)
            Session4_WonderGraph.state.edges = [];
            nodes.forEach((n, i) => {
                if (i > 0) {
                    Session4_WonderGraph.state.edges.push({ from: 0, to: i, color: n.color });
                }
            });

            Session4_WonderGraph.renderer.drawGraph();
        },

        drawGraph: () => {
            const container = document.getElementById('k4-graph-container');
            if (!container) return;

            const { nodes, edges } = Session4_WonderGraph.state;
            const viewport = document.createElement('div');
            viewport.className = 'k4-viewport';
            viewport.id = 'k4-viewport';

            // Draw SVG edges
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'k4-svg-layer');
            svg.setAttribute('viewBox', `0 0 ${container.clientWidth} ${container.clientHeight}`);

            edges.forEach(e => {
                const from = nodes[e.from];
                const to = nodes[e.to];
                if (!from || !to) return;

                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', from.x);
                line.setAttribute('y1', from.y);
                line.setAttribute('x2', to.x);
                line.setAttribute('y2', to.y);
                line.setAttribute('stroke', e.color);
                line.setAttribute('class', 'k4-edge');
                svg.appendChild(line);
            });

            viewport.appendChild(svg);

            // Draw nodes
            nodes.forEach((n, i) => {
                const el = document.createElement('div');
                el.className = 'k4-node';
                el.style.width = '60px';
                el.style.height = '60px';
                el.style.left = `${n.x}px`;
                el.style.top = `${n.y}px`;
                el.style.borderColor = n.color;
                el.style.color = n.color;
                el.style.boxShadow = `0 0 20px ${n.color}40, inset 0 0 10px ${n.color}20`;
                el.style.animationDelay = `${i * 0.05}s`;

                el.innerHTML = `
                    <div class="k4-node-icon">${n.icon}</div>
                    <div class="k4-node-label" style="color:${n.color}">${n.title}</div>
                `;

                el.onclick = () => Session4_WonderGraph.actions.selectNode(n, el);
                viewport.appendChild(el);
            });

            container.innerHTML = '';
            container.appendChild(viewport);

            // Add controls
            const controls = document.createElement('div');
            controls.className = 'k4-controls';
            controls.innerHTML = `
                <button class="k4-ctrl-btn" onclick="Session4_WonderGraph.actions.zoomIn()" title="Zoom In">+</button>
                <button class="k4-ctrl-btn" onclick="Session4_WonderGraph.actions.zoomOut()" title="Zoom Out">−</button>
                <button class="k4-ctrl-btn" onclick="Session4_WonderGraph.actions.resetView()" title="Reset View">⟳</button>
            `;
            container.appendChild(controls);
        }
    },

    // --- ACTIONS ---
    actions: {
        selectNode: (node, el) => {
            // Deselect previous
            document.querySelectorAll('.k4-node.selected').forEach(n => n.classList.remove('selected'));
            el.classList.add('selected');

            Session4_WonderGraph.state.selectedNode = node;

            // Show info panel
            const panel = document.getElementById('k4-info-panel');
            if (panel) {
                panel.querySelector('.k4-info-title').textContent = node.title;
                panel.querySelector('.k4-info-desc').textContent = node.desc || 'A compiled concept in your knowledge universe.';
                panel.classList.add('show');
            }

            // Trigger audio from Session 1
            if (window.KhelOS && window.KhelOS.registry[1] && window.KhelOS.registry[1].audio) {
                const hue = parseInt(node.color.replace('#', ''), 16) % 360;
                window.KhelOS.registry[1].audio.play(hue);
            }
        },

        closeInfoPanel: () => {
            const panel = document.getElementById('k4-info-panel');
            if (panel) panel.classList.remove('show');
            document.querySelectorAll('.k4-node.selected').forEach(n => n.classList.remove('selected'));
        },

        zoomIn: () => {
            Session4_WonderGraph.state.viewport.scale = Math.min(2, Session4_WonderGraph.state.viewport.scale + 0.2);
            Session4_WonderGraph.renderer.applyViewport();
        },

        zoomOut: () => {
            Session4_WonderGraph.state.viewport.scale = Math.max(0.5, Session4_WonderGraph.state.viewport.scale - 0.2);
            Session4_WonderGraph.renderer.applyViewport();
        },

        resetView: () => {
            Session4_WonderGraph.state.viewport = { x: 0, y: 0, scale: 1 };
            Session4_WonderGraph.renderer.applyViewport();
        },

        applyViewport: () => {
            const viewport = document.getElementById('k4-viewport');
            if (viewport) {
                const { x, y, scale } = Session4_WonderGraph.state.viewport;
                viewport.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            }
        }
    },

    // --- LIFECYCLE METHODS ---
    init: function() {
        try {
            const root = document.getElementById('k4-root');
            if (!root) return;

            root.innerHTML = `
                <div class="k4-container" id="k4-graph-container"></div>
                <div class="k4-info-panel" id="k4-info-panel">
                    <button class="k4-info-close" onclick="Session4_WonderGraph.actions.closeInfoPanel()">✕</button>
                    <div class="k4-info-title"></div>
                    <div class="k4-info-desc"></div>
                </div>
            `;

            this.renderer.render();

            // Listen for layout mode changes from Session 1
            if (window.KhelOS && window.KhelOS.registry[1]) {
                const originalSetMode = window.KhelOS.registry[1].setMode;
                if (originalSetMode) {
                    window.KhelOS.registry[1].setMode = (mode) => {
                        originalSetMode.call(window.KhelOS.registry[1], mode);
                        this.state.layoutMode = mode;
                        this.renderer.render();
                    };
                }
            }

            console.log("[Session 4] Wonder Graph Visualizer Initialized.");
        } catch(e) {
            throw new Error("Session 4 UI Initialization failed: " + e.message);
        }
    },

    destroy: function() {
        console.log("[Session 4] Wonder Graph Visualizer Unloaded.");
        if (this.state.animationFrame) cancelAnimationFrame(this.state.animationFrame);
    }
};

/* ═══════════════════════════════════════════════════════════
   BOOT SESSION 4
   ═══════════════════════════════════════════════════════════ */
if (typeof KhelOS !== 'undefined') {
    KhelOS.register(4, Session4_WonderGraph);
} else {
    console.error("[KhelOS] Core Kernel not found. Session 4 cannot boot.");
}
</script>

    `,

    // --- DATA: SUB-DOMAINS (Drill Down Tray) ---
